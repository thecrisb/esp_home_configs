globals:
  - id: register
    type: int
    restore_value: no
    initial_value: '0'

i2c_device:
  - id: unknown_device_${address}
    address: ${address}

sensor:
  - platform: template
    name: I2C Raw Value ${address}
    update_interval: 1s
    state_class: "measurement"
    lambda: |-
      uint8_t data = 0;
      if (id(unknown_device_${address}).read_register(id(tregister).state, &data, 1) == i2c::ERROR_OK) {
        return data;
      }
      return {};

number:
  - platform: template
    id: tregister
    name: "target register"
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1
