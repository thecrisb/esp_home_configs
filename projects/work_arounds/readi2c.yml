i2c_device:
  - id: unknown_device_${address}
    address: ${address}

sensor:
  - platform: template
    name: I2C Raw Value ${address}
    update_interval: 1s
    lambda: |-
      uint8_t data = 0;
      if (id(unknown_device_${address}).read_register(0x01, &data, 1) == i2c::ERROR_OK) {
        return data;
      }
      return {};
