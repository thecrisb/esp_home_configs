defaults:
  input_platform: gpio
  output_platform: gpio
  default:
    output_as: relay
    decoupled: false
    

binary_sensor: 
  - |-
    <% set ns = namespace(b = {
        "platform": input_platform,
        "id": "button_{0}".format(pair),
        "pin": ${input_pin},
      } )
    %>
    <% if not (decoupled | default(default.decoupled)) and output_as == "switch" %>
      <% 
        set ns.b = dict(
          b, **{"on_press": [{"switch.toggle": relay_id}]}
        )
      %>
    <% endif %>
    ${ns.b}

${output_as | default(output_as) }:
  - |-
    <% set ns = namespace(r = {
        "platform": output_platform,
        "id": "{0}_{1}".format("${output_as}", pair),
        "pin": output_pin
      } )
    %>
    <% if not decoupled | default(default.decoupled)) %>
      <% 
        set ns.r = dict(
          r, **{"name": "{0} {1}".format("${output_as | default(output_as)}", pair)}
        )
      %>
    <% endif %>
    ${ns.r}
